  hikkahost: "🌼 HikkaHost"
  choose_installation: "<tg-emoji emoji-id=5363805650327450240>🪐</tg-emoji> <b>Heroku インストールオプションを選択してください:</b>"
  vds_install: "<tg-emoji emoji-id=5471952986970267163>💎</tg-emoji> VDS でのインストールプロセスは単一のコマンドで完了します:\n<pre><code class=\"language-shell\">sudo apt update &amp;&amp; sudo apt upgrade -y &amp;&amp; sudo apt install -y git python3-pip &amp;&amp; git clone https://github.com/Heroku-userbot/Heroku &amp;&amp; cd Heroku &amp;&amp; pip install -r requirements.txt &amp;&amp; python3 -m heroku</code></pre>\n<i>注: sudo 権限がない場合は、コマンドの該当部分を省略してください。</i>"
  wsl_install: "<b>WSL をインストールします。</b> これを行うには、PowerShell を管理者として開き、<code>wsl --install -d Ubuntu-22.04</code> と入力します \n⚠️ <i>WSL をインストールするには、Windows 10 ビルド 2004 または Windows 11 の任意のバージョンと、仮想化サポートを備えた PC が必要です。以前のバージョンの OS へのインストールについては、</i> <a href=\"https://learn.microsoft.com/en-us/windows/wsl/install-manual\">このページ</a><i>を参照してください</i>\n\n⬜️ <b>PC を再起動し、Ubuntu 22.04.x アプリケーションを起動します</b> \n\n⬜️ <b>その中にコマンドを貼り付けます (右クリック):</b> <code>curl -Ss https://bootstrap.pypa.io/get-pip.py | python3</code> \n⚠️ <i>黄色い警告が表示された場合は、</i> <code>export PATH=\"/home/username/.local/bin:$PATH\"</code> <i>と入力し、/home/username/.local/bin をメッセージに記載されているパスに置き換えてください</i>\n\n⬜️ <b>コマンドを貼り付けます (右クリック):</b> \n<pre><code class=\"language-bash\">clear &amp;&amp; git clone https://github.com/Heroku-userbot/Heroku &amp;&amp; cd Heroku &amp;&amp; pip install -r requirements.txt &amp;&amp; python3 -m heroku</code></pre>\n🔗 <b>API_ID と API_HASH はどこで入手できますか？</b>: <a href=\"https://youtu.be/DcqDA249Lhg?t=24\">ビデオ</a>"
  userland_install: "<b>UserLAnd をこの</b> <a href=\"https://play.google.com/store/apps/details?id=tech.ula\">リンク</a><b>からインストールします</b>\n\n<b>開き、Ubuntu —&gt; Minimal —&gt; Terminal を選択します</b>\n\n<b>ディストリビューションのインストールを待ちます（お茶でも飲んで待っていてください）</b>\n\n<b>インストールが成功するとターミナルが開くので、そこに入力します:</b>\n<pre><code class=\"language-bash\">sudo apt update &amp;&amp; sudo apt upgrade -y &amp;&amp; sudo apt install python3 git python3-pip -y &amp;&amp; git clone https://github.com/Heroku-userbot/Heroku &amp;&amp; cd Heroku &amp;&amp; sudo pip install -r requirements.txt &amp;&amp; python3 -m heroku</code></pre>\n\n<b>インストールの最後にリンクが表示されるので、それに従ってアカウント情報を入力し、ログインします。\n\nこれで UserLAnd に Heroku がインストールされました。</b>"
  hikkahost_install: "<b>🌘 HikkaHost に Heroku をインストールするには？</b>\n\n1. @hikkahost_bot に移動します\n2. \"Install\" を選択します\n3. \"🪐 Heroku\" を選択します\n\nそしてインストールを続けます。\n\n<b>その後、リンクを受け取るので、それを開いてアカウントにログインしてください。</b>"
  too_many_args: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>引数が正しくありません。形式:</b> <code>{prefix}{cmd} [チャットID] [モジュール]</code>"
  blacklisted: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>チャット {} をユーザーボットのブラックリストに追加しました</b>"
  unblacklisted: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>チャット {} をユーザーボットのブラックリストから削除しました</b>"
  user_blacklisted: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>ユーザー {} をユーザーボットのブラックリストに追加しました</b>"
  user_unblacklisted: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>ユーザー {} をユーザーボットのブラックリストから削除しました</b>"
  what_prefix: "<tg-emoji emoji-id=5870609858520158157>ℹ</tg-emoji> <b>プレフィックスを指定してください。</b>\n<code>setprefix !</code>\n<code>setprefix ! @user</code>"
  what_prefixes: "<tg-emoji emoji-id=5870609858520158157>ℹ</tg-emoji> <b>プレフィックスを空白で区切って指定してください (最初のものがメインになります)。</b>\n<code>setprefixes ! .</code>\n<code>setprefixes --user ID ! .</code>"
  prefix_incorrect: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>プレフィックスは空白を含まない1文字である必要があります (「s」は不可)。長いプレフィックスや絵文字を使うには、</b> <code>config Settings</code> <b>で</b> <code>allow_nonstandart_prefixes</code> <b>を有効にしてください</b>"
  prefix_set: "{} <b>コマンドプレフィックスを変更しました。以前の値に戻すには:</b>\n<pre><code class=\"language-heroku\">{newprefix}setprefix {oldprefix}</code></pre>"
  prefixes_set: "{} <b>コマンドプレフィックスを置き換えました。以前の値に戻すには:</b>\n<pre><code class=\"language-heroku\">{newprefix}setprefixes {oldprefix}</code></pre>"
  entity_prefix_set: "{} <b>{entity_name} 用のコマンドプレフィックスを変更しました。以前の値に戻すには:</b>\n<pre><code class=\"language-heroku\">{newprefix}setprefix {oldprefix} {entity_id}</code></pre>"
  entity_prefixes_set: "{} <b>{entity_name} 用のコマンドプレフィックスを置き換えました。以前の値に戻すには:</b>\n<pre><code class=\"language-heroku\">{newprefix}setprefixes --user {entity_id} {oldprefix}</code></pre>"
  id_not_found_scgroup: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>このユーザーはユーザーボットへのアクセス権を持っていないため、個人用プレフィックスは役に立ちません。先にアクセス権を付与してください:</b> <code>sgroupadd</code>, <code>owneradd</code> <b>または</b> <code>tsec</code>"
  invalid_id_or_username: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>ユーザー</b> <code>{}</code> <b>が見つかりません。複数のプレフィックスを設定したい場合は、</b> <code>setprefixes</code> <b>を使用してください</b>"
  alias_created: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>エイリアスが作成されました。</b> <code>{}</code> <b>でアクセスできます</b>"
  aliases_created: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>追加したエイリアス: {count} 個</b>\n<blockquote expandable>{aliases}</blockquote>"
