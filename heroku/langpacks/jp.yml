  delalias_args: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>エイリアスを指定してください:</b> <code>{prefix}delalias &lt;エイリアス&gt;[, エイリアス...]</code> <b>または、すべて削除するには</b> <code>{prefix}delalias -c</code>"
