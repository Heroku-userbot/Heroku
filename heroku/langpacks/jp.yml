  _cmd_doc_addalias: "<エイリアス>[, エイリアス...] <コマンド> [引数] - エイリアスを作成します。コマンドはプレフィックスなしで指定してください。例: addalias h help または addalias h, hlp && help -f"
  _cmd_doc_aliases: "すべてのエイリアスを表示します"
  _cmd_doc_blacklist: "[チャットID] [モジュール] - チャット (デフォルトは現在のチャット) でユーザーボット (またはモジュールのみ) が反応しないようにします。ID は -100 付きでも指定できます。ブラックリストに入れたチャットではあなた自身のコマンドも動作しなくなるため、解除は別のチャットから行ってください: unblacklist <チャットID>"
  _cmd_doc_blacklistuser: "[ID|返信] - ユーザーがコマンドを実行できないようにします。引数なしの場合: 返信先のユーザー、または PM の相手が対象です。@username には対応していません"
  _cmd_doc_cleardb: "データベース全体をクリアし、事実上のファクトリーリセットを実行します"
  _cmd_doc_delalias: "<エイリアス>[, エイリアス...] | -c|--clear - エイリアスを削除します (カンマ区切り)。-c ですべてを一度に削除します (確認なし！)"
  _cmd_doc_heroku: "Heroku バージョンを取得します"
  _cmd_doc_setprefix: "<プレフィックス> [@ユーザー|ID|返信] - コマンドのプレフィックスを変更します。対象なしの場合はあなたのメインのプレフィックスを変更し、対象ありの場合はユーザーボットへのアクセス権を持つユーザーに個人用プレフィックスを設定します (アクセス権のない人への返信では、あなた自身のプレフィックスが変更されます)"
  _cmd_doc_setprefixes: "<プレフィックス> [プレフィックス ...] [--user @ユーザー|ID] - コマンドのプレフィックスをすべて置き換えます (最初のものがメイン)。--user または返信で、別のユーザーの個人用プレフィックスを設定します"
  _cmd_doc_togglecmd: "<モジュール> <コマンド> または <コマンド> - コマンドを有効化/無効化します (もう一度実行すると元に戻ります)"
  _cmd_doc_togglemod: "<モジュール> - モジュール全体を有効化/無効化します (もう一度実行すると元に戻ります)。Settings モジュールは無効にできません"
  _cmd_doc_clearmodule: "<モジュール> - モジュールのデータと設定をすべてデータベースから削除します (モジュールとそのコマンドの無効化も解除されます)"
  _cmd_doc_unblacklist: "[チャットID] [モジュール] - チャット (デフォルトは現在のチャット) でのユーザーボット (またはモジュール) のブラックリストを解除します。ID は -100 付きでも指定できます"
  _cmd_doc_unblacklistuser: "[ID|返信] - ユーザーが許可されたコマンドを再び実行できるようにします。引数なしの場合: 返信先のユーザー、または PM の相手が対象です。@username には対応していません"
  _cfg_nonstandart_prefixes: "フラグや複数の記号などの非標準プレフィックスを許可します"
  _cfg_rich_mode: "HerokuをRichメッセージで表示"
  _cls_doc: "コアユーザーボット設定を制御します"

