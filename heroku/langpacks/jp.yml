loader_restrictor:
  q1: "インストールしたモジュールは、あなたのアカウントに対してどのようなアクセス権を得ますか？"
  q1_ans1: "限定的: 作者がモジュールの説明に書いた範囲だけに限られる"
  q1_ans2: "あなたがそのコマンドを呼び出したチャットのみ"
  q1_ans3: "あなた自身がそのコマンドのどれかを呼び出すまでは何もない"
  q1_ans4: "完全: あなたと同じく全チャット、連絡先、ギフト、スター"
  q1_hint: "モジュールはあなたとして動作します: すべてのチャットを読み、バックグラウンドで動き、スターを使い、ギフトを送ることもできます。組み込みの保護は単純な試みしか検出できず、回避も可能です。頼らずにコードを確認してください。"
  q2: "見知らぬ人が自作のモジュールを送ってきて、テストしてほしいと頼んできました。あなたはどうしますか？"
  q2_ans1: "すぐにインストールする: 頼まれているし、断るのは気まずいから"
  q2_ans2: "コードを確認するか、サポートチャットに #check_scam 付きで見せる"
  q2_ans3: "安全かどうか作者に尋ね、その言葉を信じる"
  q2_ans4: "同じユーザーボット内の別アカウントにインストールする、その方が安全だから"
  q2_hint: "個人チャットで「テスト用」に送られてくるモジュールは、アカウント乗っ取りのよくある手口です。同じユーザーボット内の別アカウントでは防げません: モジュールはすべてにアクセスできます。不安なら <a href=\"https://t.me/heroku_talks\">@heroku_talks</a> で #check_scam を付けて見せてください。"
  q3: "モジュールは、ユーザーボットが動作しているサーバーやデバイス上のファイルを操作できますか？"
  q3_ans1: "いいえ、モジュールには Telegram しか見えず、デバイス上のファイルには触れられない"
  q3_ans2: "Telegram が別途権限を与えた場合のみ"
  q3_ans3: "はい、ファイルの読み取り・変更・削除ができ、セッションファイルも例外ではない"
  q3_ans4: "Telegram からダウンロードした写真と動画のみ"
  q3_hint: "ユーザーボットは Python プログラムで、モジュールはその一部として同じ権限を持ちます。モジュールはアカウントの鍵であるセッションファイルも読めます。Telegram はモジュールについて何も知りません。"
  q4: "あるモジュールが、あなたに知られずにチャットの内容とセッションファイルを他人のサーバーへ送信しました。あなたが目にする可能性が最も高いのは何ですか？"
  q4_ans1: "モジュールの不審な活動についての Telegram からの警告"
  q4_ans2: "ユーザーボットのログに残る、そのモジュールのエラーや不審な記録"
  q4_ans3: "データ送信をブロックしたというユーザーボットの保護機能からの通知"
  q4_ans4: "何もない: モジュールは裏で動き、痕跡を残すとは限らない"
  q4_hint: "Telegram にはモジュールがサーバー上で何をしているか見えず、モジュールはログに書きたいことしか書きません。組み込みの保護は単純な試みしか検出できず、回避も可能です。頼らずにコードを確認してください。"
  timeout: "<tg-emoji emoji-id=5447644880824181073>⚠️</tg-emoji> <b>質問の制限時間 (60 秒) が過ぎました。最初からやり直すには、このチャットで</b> <code>/start lm_verify</code> <b>を送信してください</b>"
  failed: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>不正解です。解説は上のアンケートにあります (💡 アイコン)。チェックは最初の質問からやり直しになり、何度でも挑戦できます: このチャットで</b> <code>/start lm_verify</code> <b>を送信してください</b>"
  already_passed: "<tg-emoji emoji-id=5118861066981344121>✅</tg-emoji> <b>すでにチェックに合格しています。モジュールのインストールはロック解除されています</b>"
  unlocked: "<tg-emoji emoji-id=5118861066981344121>✅</tg-emoji> <b>チェックに合格し、モジュールのインストールのロックが解除されました。インストールがブロックされていた場合は、もう一度コマンドを実行してください。</b>"
  unlock_prompt: "<tg-emoji emoji-id=5447644880824181073>⚠️</tg-emoji> <b>モジュールのインストールはロックされています。</b> ロックを解除するには、安全に関する 4 つの質問に答えてください: 各質問の制限時間は 60 秒で、間違えるとチェックは最初からやり直しになります。何度でも挑戦できます。"
  unlock_prompt_btn: "チェックを開始 (4 問)"
  name: "LoaderRestrictor"
  _cls_doc: "モジュールのインストール前に必要な安全確認"

