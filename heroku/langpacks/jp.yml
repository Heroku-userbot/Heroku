  heroku: "{} <b>{}.{}.{}</b> <i>{}</i>\n\n<tg-emoji emoji-id=5289608677244811430>📁</tg-emoji> <b>heroku-tl:</b> <i>{}</i>\n\n<tg-emoji emoji-id=5228879218363872764>⌨</tg-emoji> <b>開発者: <a href=\"https://t.me/zetgo\">@zetgo</a></b>"
  rich_heroku_message: '<figure><img src="{banner_url}"/></figure><h1>{platform} Userbot</h1><table bordered><tr><th>コンポーネント</th><th>現在のリリース</th></tr><tr><td><b>バージョン</b></td><td><code>{version}</code></td></tr><tr><td><b>ビルド</b></td><td>{build}</td></tr><tr><td><b>Heroku TL</b></td><td><code>{htl_version}</code></td></tr><tr><td><b>APIレイヤー</b></td><td><code>{layer}</code></td></tr><tr><td><b>現在のユーザー</b></td><td><code>{current_user}</code></td></tr><tr><td><b>開発者</b></td><td><a href="https://t.me/zetgo">@zetgo</a></td></tr></table>'
