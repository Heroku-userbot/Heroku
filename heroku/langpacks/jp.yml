loader_restrictor:
  q1: "インストールしたモジュールは実際に何ができるのでしょうか?"
  q1_ans1: "まさにその説明どおりです - それ以上のことはありません"
  q1_ans2: "呼び出されたチャットでのみメッセージを読む"
  q1_ans3: "コマンドを明示的に呼び出した場合にのみ動作します"
  q1_ans4: "Telegram と同じ、その他: ギフトの送信、アカウントの削除"
  q1_hint: "ユーザーボットには危険なリクエストに対する基本的な保護機能がありますが、モジュールがアカウントを完全に制御できる可能性があります。"
  q2: "見知らぬ人があなたにメッセージを送り、モジュールをテストするように頼みます。職業はなんですか？"
  q2_ans1: "もちろん、彼らを助けてみませんか?"
  q2_ans2: "自分で/AIでコードをチェックします。不明な場合は、#check_scam を付けて報告してください"
  q2_ans3: "著者に安全かどうか尋ね、その言葉を信じてください"
  q2_ans4: "別のアカウントにインストールしてテストしてください - その方が安全です"
  q2_hint: "公式の開発者チャネルからのものではないモジュールは、危険なコードがないかチェックする必要があります。自分自身を危険にさらさないでください。"
  q3: "モジュールは Telegram だけでなく、サーバー/ホスティングのファイルやシステムを操作できますか?"
  q3_ans1: "いいえ、モジュールは Telegram 内でのみ動作し、他のファイルは表示されません"
  q3_ans2: "Telegramから別途許可を得ている場合のみ"
  q3_ans3: "はい - モジュールはユーザーボットの一部です。ファイルの読み取り、変更、削除ができます。"
  q3_ans4: "Telegram からの写真とビデオのみ"
  q3_hint: "userbot は、サーバー上で実行される Python プログラムです。モジュールは同じプログラムの一部であり、同じ権限があります。"
  q4: "モジュールがユーザーの許可なく動作し始めた場合 (データ盗難など) に気づきますか?"
  q4_ans1: "はい、Telegram は不審なアクティビティについてすぐに通知します"
  q4_ans2: "はい、モジュールからの不審なログに気づきます"
  q4_ans3: "いいえ、しかしユーザーボットの基本的な保護はそのようなアクティビティを捕捉する必要があります"
  q4_ans4: "必ずしもそうとは限りません - モジュールは手遅れになるまで、通知なしで目に見えずに動作する可能性があります"
  q4_hint: "悪意のあるモジュールの主な危険性はステルスです。コードを事前にチェックしないと、手遅れになるまで問題に気付かない可能性があります。"
  timeout: "<tg-emoji emoji-id=5447644880824181073>⚠️</tg-emoji> <b>すべての質問に時間内に回答できませんでした。 </b> <code>/start lm_verify</code> を送信してもう一度お試しください。"
  failed: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>間違った答えです。サードパーティ モジュールのインストールのロックを解除するには、</b> <code>/start lm_verify</code> を送信して再試行してください。"
  already_passed: "<tg-emoji emoji-id=5118861066981344121>✅</tg-emoji> <b>すでにチェックに合格しています - サードパーティ モジュールのインストールはロック解除されています</b>"
  unlocked: "<tg-emoji emoji-id=5118861066981344121>✅</tg-emoji> <b>チェックに合格し、サードパーティ モジュールのインストールのロックが解除されました</b>"
  unlock_prompt: "<tg-emoji emoji-id=5447644880824181073>⚠️</tg-emoji> <b>サードパーティ モジュールのインストールのロックを解除するには、簡単なチェックを完了してください</b>"
  unlock_prompt_btn: "小切手を受け取ります"

