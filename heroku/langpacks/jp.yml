  happy_beta: "\n\n<tg-emoji emoji-id=5465188915990255885>🌟</tg-emoji>  <b>あなたは、<code>{}</code>バージョンの幸運な所有者ですね！</b>"
  no_command: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>コマンド</b> <code>{}</code> <b>が見つかりません (プレフィックスなしで指定してください)</b>"
  alias_exists: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>エイリアス</b> <code>{alias}</code> <b>はすでにコマンド</b> <code>{command}</code> <b>で使用されています。削除するには</b> <code>delalias {alias}</code> <b>を使用してください</b>"
  alias_args: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>エイリアスとコマンドを指定してください:</b> <code>{prefix}addalias h help</code>"
