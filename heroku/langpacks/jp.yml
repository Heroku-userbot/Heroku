  _cmd_doc_tsec: "<user|chat|sgroup> [ターゲット] <ルール> [時間] - コマンドまたはモジュールへのアクセスを許可します。引数なしの場合はルール一覧\nターゲット: user — @ユーザー名（@ は必須）または ID、メッセージへの返信または PM; chat — 現在のチャット、@ユーザー名またはチャット ID（-100… も可）; sgroup — セキュリティグループ名\nルール — コマンド名（エイリアス不可）またはモジュール名\n時間: 30s, 10m, 2h, 1d, 1w。組み合わせ可能: 1d12h または 1d 12h。時間を指定しない場合は無期限\n例: .tsec user @vasya ban 1d, .tsec chat weather 1d12h, .tsec sgroup friends Loader"
