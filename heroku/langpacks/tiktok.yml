loader_restrictor:
  q1: "Какой доступ к твоему акку получает любой модуль, который ты ставишь?"
  q1_ans1: "Ограниченный: только то, что автор написал в описании"
  q1_ans2: "Только к чату, где ты вызвал его команду"
  q1_ans3: "Никакого, пока сам не вызовешь его команду"
  q1_ans4: "Полный, как у тебя: все чаты, контакты, подарки, звёзды"
  q1_hint: "Модуль действует как ты: читает все чаты, пашет в фоне, тратит звёзды, отдаёт подарки. Встроенная защита ловит только простое, её можно обойти — не надейся на неё, чекай код."
  q2: "Незнакомец скинул свой модуль и просит потестить. Твои действия?"
  q2_ans1: "Сразу поставлю: человек просит, отказывать неудобно"
  q2_ans2: "Проверю код или покажу в чате поддержки с #check_scam"
  q2_ans3: "Спрошу автора, безопасен ли модуль, и поверю на слово"
  q2_ans4: "Поставлю на второй акк в этом же юзерботе, так безопаснее"
  q2_hint: "«Модуль на тест» в лс — частая схема угона акков. Второй акк в том же юзерботе не спасёт: модуль получит доступ ко всему. Сомневаешься — кинь его в <a href=\"https://t.me/heroku_talks\">@heroku_talks</a> с #check_scam."
  q3: "Может ли модуль работать с файлами на сервере или устройстве, где крутится юзербот?"
  q3_ans1: "Не, модуль видит только Телегу, до других файлов не достанет"
  q3_ans2: "Только если Телега выдаст ему отдельное разрешение"
  q3_ans3: "Да, может читать, менять и удалять файлы, даже файл сессии"
