  desc: "<tg-emoji emoji-id=5188377234380954537>🪐</tg-emoji> <b>Че такое Userbot?</b>\n\n<tg-emoji emoji-id=5472238129849048175>😎</tg-emoji> Userbot - это <b>софт</b>, который через Telegram API делает <b>грязную работу за тебя</b>. Типа <b>спам, инвайт, качалка медиа и прочий движ</b>.\n\n<tg-emoji emoji-id=5474667187258006816>😎</tg-emoji> Юзерботы работают <b>прямо на твоем акке</b>, а не как обычные боты. Короче ты становишься киборгом.\n\n<tg-emoji emoji-id=5472267631979405211>🚫</tg-emoji> Но! <b>Telegram это официально не одобряет</b>, так что если будешь творить дичь — словишь бан. <b>Будь аккуратнее</b> и не ставь скам-модули.\n\n"
