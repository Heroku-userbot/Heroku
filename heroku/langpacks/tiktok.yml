  user_unblacklisted: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>Чел {} разбанен</b>"
  what_prefix: "<tg-emoji emoji-id=5870609858520158157>ℹ</tg-emoji> <b>Кидай префикс.</b>\n<code>setprefix !</code>\n<code>setprefix ! @user</code>"
  what_prefixes: "<tg-emoji emoji-id=5870609858520158157>ℹ</tg-emoji> <b>Кидай префиксы через пробел (первый — главный).</b>\n<code>setprefixes ! .</code>\n<code>setprefixes --user ID ! .</code>"
  prefix_incorrect: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Префикс — один символ без пробелов, и не «s». Хочешь длинный или эмодзи — врубай</b> <code>allow_nonstandart_prefixes</code> <b>в</b> <code>config Settings</code>"
