  _cmd_doc_tsec: "<user|chat|sgroup> [цель] <правило> [время] - Дать доступ к команде или модулю. Без аргументов — список правил\nЦель: user — @юзернейм (только с @) или ID, ответ на сообщение или ЛС; chat — этот чат, @юзернейм или ID чата (-100… тоже катит); sgroup — имя сквада\nПравило — имя команды (без алиасов) или модуля\nВремя: 30s, 10m, 2h, 1d, 1w, можно вместе: 1d12h или 1d 12h; без времени — навсегда\nПримеры: .tsec user @vasya ban 1d, .tsec chat weather 1d12h, .tsec sgroup friends Loader"
