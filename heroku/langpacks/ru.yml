loader_restrictor:
  name: "LoaderRestrictor"
  _cls_doc: "Проверка знаний о безопасности перед установкой модулей"
  q1: "Какой доступ к вашему аккаунту получает любой установленный модуль?"
  q1_ans1: "Ограниченный: только то, что автор указал в описании модуля"
  q1_ans2: "Только к чату, в котором вы вызвали его команду"
  q1_ans3: "Никакого, пока вы сами не вызовете одну из его команд"
  q1_ans4: "Полный, как у вас: все чаты, контакты, подарки, звёзды"
  q1_hint: "Модуль действует как вы: читает все чаты, работает в фоне, тратит звёзды, передаёт подарки. Встроенная защита ловит только простые попытки, её можно обойти — не полагайтесь на неё, проверяйте код."
  q2: "Незнакомец прислал свой модуль и просит его протестировать. Что сделаете?"
  q2_ans1: "Сразу установлю: человек просит помочь, а отказывать неудобно"
  q2_ans2: "Проверю код или покажу в чате поддержки с пометкой #check_scam"
  q2_ans3: "Спрошу автора, безопасен ли модуль, и поверю ему на слово"
  q2_ans4: "Поставлю его на второй аккаунт в этом же юзерботе, так безопаснее"
  q2_hint: "«Модуль на тест» в личке — частая схема угона аккаунтов. Второй аккаунт в том же юзерботе не спасёт: модуль получит доступ ко всему. Сомневаетесь — покажите его в <a href=\"https://t.me/heroku_talks\">@heroku_talks</a> с пометкой #check_scam."
  q3: "Может ли модуль работать с файлами на сервере или устройстве, где запущен юзербот?"
  q3_ans1: "Нет, модуль видит только Telegram и не может трогать другие файлы"
  q3_ans2: "Только если Telegram выдаст ему отдельное разрешение"
  q3_ans3: "Да, может читать, менять и удалять файлы, включая файл сессии"
  q3_ans4: "Только с фото и видео, которые скачаны из Telegram"
  q3_hint: "Юзербот — программа на Python, а модуль — её часть с теми же правами. Он может прочитать файл сессии — ключ к вашему аккаунту. Telegram о модулях ничего не знает."
  q4: "Модуль без вашего ведома отправил переписку и файл сессии на чужой сервер. Что вы, скорее всего, увидите?"
  q4_ans1: "Предупреждение от Telegram о подозрительной активности модуля"
  q4_ans2: "Ошибки и подозрительные записи от этого модуля в логах юзербота"
  q4_ans3: "Сообщение защиты юзербота, что отправка данных заблокирована"
  q4_ans4: "Ничего, модуль работает в фоне и не обязан оставлять следов"
  q4_hint: "Telegram не видит, что модуль делает на сервере, а в логи модуль пишет что захочет. Встроенная защита ловит только простые попытки, её можно обойти — не полагайтесь на неё, проверяйте код."
  timeout: "<tg-emoji emoji-id=5447644880824181073>⚠️</tg-emoji> <b>Время на вопрос (60 секунд) вышло. Чтобы начать заново, отправьте в этот чат</b> <code>/start lm_verify</code>"
  failed: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Ответ неверный — пояснение есть в опросе выше (значок 💡). Проверка начнётся с первого вопроса, попыток сколько угодно: отправьте в этот чат</b> <code>/start lm_verify</code>"
  already_passed: "<tg-emoji emoji-id=5118861066981344121>✅</tg-emoji> <b>Вы уже прошли проверку — установка модулей разблокирована</b>"
  unlock_prompt: "<tg-emoji emoji-id=5447644880824181073>⚠️</tg-emoji> <b>Установка модулей заблокирована.</b> Чтобы открыть её, ответьте на 4 вопроса о безопасности: на каждый 60 секунд, при ошибке проверка начнётся заново. Пересдавать можно сколько угодно."
  unlock_prompt_btn: "Начать проверку (4 вопроса)"
  unlocked: "<tg-emoji emoji-id=5118861066981344121>✅</tg-emoji> <b>Проверка пройдена, установка модулей разблокирована. Если установка была заблокирована, повторите команду.</b>"
