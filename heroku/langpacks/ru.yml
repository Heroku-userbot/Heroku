  name: HerokuBackup
settings:
  choose_installation: "<tg-emoji emoji-id=5363805650327450240>🪐</tg-emoji> <b>Выберите вариант установки Heroku:</b>"
  vds_install: "<tg-emoji emoji-id=5471952986970267163>💎</tg-emoji> Процесс установки на VDS выполняется одной командой:\n<pre><code class=\"language-shell\">sudo apt update &amp;&amp; sudo apt upgrade -y &amp;&amp; sudo apt install -y git python3-pip &amp;&amp; git clone https://github.com/Heroku-userbot/Heroku &amp;&amp; cd Heroku &amp;&amp; pip install -r requirements.txt &amp;&amp; python3 -m heroku</code></pre>\n<i>Примечание: Если у вас отсутствуют права sudo, исключите соответствующую часть команды.</i>"
  wsl_install: "<b>Установите WSL.</b> Для этого откройте PowerShell с правами администратора и выполните <code>wsl --install -d Ubuntu-22.04</code> \n⚠️ <i>Для установки WSL необходима Windows 10 build 2004 или Windows 11 любой версии и ПК с поддержкой виртуализации. Для установки на более ранние версии ОС обратитесь к</i> <a href=\"https://learn.microsoft.com/ru-ru/windows/wsl/install-manual\">этой странице</a>\n\n⬜️ <b>Перезагрузите ПК и запустите приложение Ubuntu 22.04.x</b> \n\n⬜️ <b>Вставьте в него команду (ПКМ):</b> <code>curl -Ss https://bootstrap.pypa.io/get-pip.py | python3</code> \n⚠️ <i>При появлении жёлтых предупреждений введите</i> <code>export PATH=\"/home/username/.local/bin:$PATH\"</code><i>, заменив /home/username/.local/bin на путь, указанный в сообщении</i>\n\n⬜️ <b>Вставьте команду (ПКМ):</b> \n<pre><code class=\"language-bash\">clear &amp;&amp; git clone https://github.com/Heroku-userbot/Heroku &amp;&amp; cd Heroku &amp;&amp; pip install -r requirements.txt &amp;&amp; python3 -m heroku</code></pre>\n🔗 <b>Где получить API_ID и API_HASH?</b>: <a href=\"https://youtu.be/DcqDA249Lhg?t=24\">Видео</a>"
  userland_install: "<b>Установите UserLAnd по</b> <a href=\"https://play.google.com/store/apps/details?id=tech.ula\">ссылке</a>\n\n<b>Откройте его, выберите Ubuntu —&gt; Minimal —&gt; Terminal</b>\n\n<b>Дождитесь установки дистрибутива, можно пока налить чаю</b>\n\n<b>После успешной установки откроется терминал, введите в него:</b>\n<pre><code class=\"language-bash\">sudo apt update &amp;&amp; sudo apt upgrade -y &amp;&amp; sudo apt install python3 git python3-pip -y &amp;&amp; git clone https://github.com/Heroku-userbot/Heroku &amp;&amp; cd Heroku &amp;&amp; sudo pip install -r requirements.txt &amp;&amp; python3 -m heroku</code></pre>\n\n<b>В конце установки появится ссылка, перейдите по ней и введите данные своего аккаунта для входа.\n\nВуаля! Вы установили Heroku на UserLAnd.</b>"
  hikkahost_install: "<b>🌘 Как установить Heroku на HikkaHost?</b>\n\n1. Перейдите в @hikkahost_bot\n2. Выберите «Установить»\n3. Выберите «🪐 Heroku»\n\nИ продолжайте установку.\n\n<b>После этого вы получите ссылку, откройте ее и войдите в свой аккаунт.</b>"
  too_many_args: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Неверные аргументы. Формат:</b> <code>{prefix}{cmd} [ID чата] [модуль]</code>"
  blacklisted: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>Чат {} добавлен в черный список юзербота</b>"
  unblacklisted: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>Чат {} удален из черного списка юзербота</b>"
  blacklisted_module: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>Модуль</b> <code>{module}</code> <b>отключён в чате</b> <code>{chat}</code>"
  unblacklisted_module: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>Модуль</b> <code>{module}</code> <b>снова работает в чате</b> <code>{chat}</code>"
  cant_disable_settings: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Модуль Settings отключить нельзя: в нём находится сама команда togglemod</b>"
  user_blacklisted: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>Пользователь {} добавлен в черный список юзербота</b>"
  user_unblacklisted: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>Пользователь {} удален из черного списка юзербота</b>"
  owner_blacklist: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Владельца нельзя добавить в чёрный список</b>"
  what_prefix: "<tg-emoji emoji-id=5870609858520158157>ℹ</tg-emoji> <b>Укажите префикс.</b>\n<code>setprefix !</code>\n<code>setprefix ! @user</code>"
  what_prefixes: "<tg-emoji emoji-id=5870609858520158157>ℹ</tg-emoji> <b>Укажите префиксы через пробел (первый станет основным).</b>\n<code>setprefixes ! .</code>\n<code>setprefixes --user ID ! .</code>"
  prefix_incorrect: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Префикс должен быть одним символом без пробелов (нельзя «s»). Для длинных префиксов и эмодзи включите</b> <code>allow_nonstandart_prefixes</code> <b>в</b> <code>config Settings</code>"
  prefix_set: "{} <b>Префикс команд изменён. Вернуть прежний:</b>\n<pre><code class=\"language-heroku\">{newprefix}setprefix {oldprefix}</code></pre>"
  prefixes_set: "{} <b>Префиксы команд заменены. Вернуть прежние:</b>\n<pre><code class=\"language-heroku\">{newprefix}setprefixes {oldprefix}</code></pre>"
