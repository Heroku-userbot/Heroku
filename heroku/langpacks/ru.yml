  _cmd_doc_inlinesec: "[инлайн-команда] - Настроить доступ к инлайн-команде. Без аргумента — глобальные ограничения"
  _cmd_doc_querysec: "Открыть настройку доступа к инлайн-запросам для посторонних пользователей"
  _cmd_doc_owneradd: "[-f|--force] [-n|--nonick] [-p|--prefix <префикс>]... <@юзернейм|ID|ответ> - Добавить владельца (полный доступ к юзерботу)\nФлаги: -f — без окна подтверждения, -n — сразу включить NoNick, -p — личный префикс (можно повторять)"
  _cmd_doc_ownerlist: "Показать список владельцев"
  _cmd_doc_ownerrm: "<@юзернейм|ID|ответ> - Удалить владельца"
  _cmd_doc_security: "[команда без префикса] - Настроить, кто может использовать команду. Без аргумента — глобальные ограничения для всех команд"
  _cmd_doc_tsec: "<user|chat|sgroup> [цель] <правило> [время] - Выдать доступ к команде или модулю. Без аргументов — список правил\nЦель: user — @юзернейм (обязательно с @) или ID, ответ на сообщение или ЛС; chat — текущий чат, @юзернейм или ID чата (подходят и -100…); sgroup — имя группы безопасности\nПравило — имя команды (без алиасов) или модуля\nВремя: 30s, 10m, 2h, 1d, 1w, можно сочетать: 1d12h или 1d 12h; без времени — навсегда\nПримеры: .tsec user @vasya ban 1d, .tsec chat weather 1d12h, .tsec sgroup friends Loader"
  _cmd_doc_tsecclr: "<user|chat|sgroup> [@юзернейм|ID|имя группы] - Удалить все таргетированные правила цели\nuser: @юзернейм/ID, ответ на сообщение или ЛС; chat: выполните в нужном чате; sgroup: имя группы безопасности\nПримеры: .tsecclr user @vasya, .tsecclr chat, .tsecclr sgroup friends"
  _cmd_doc_tsecrm: "<user|chat|sgroup> [цель] <правило> - Удалить таргетированное правило. Имя правила пишите так, как оно показано в .tsec (подойдёт и имя модуля или команды)\nuser: @юзернейм/ID, ответ на сообщение или ЛС; chat: выполните в самом чате (не в ЛС); sgroup: имя группы безопасности\nПримеры: .tsecrm user @vasya ban, .tsecrm chat Loader, .tsecrm sgroup friends ban"
  querysec_info: "<tg-emoji emoji-id=5870704313440932932>🔒</tg-emoji> Разрешить инлайн-запросы к боту всем пользователям, а не только тем, кому выданы права? Кнопка показывает текущее состояние"
