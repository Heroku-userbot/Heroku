  who_to_blacklist: "<tg-emoji emoji-id=5382187118216879236>❓</tg-emoji> <b>Кого заблокувати? Вкажіть числовий ID користувача або дайте відповідь на його повідомлення (@username не підтримується)</b>"
  who_to_unblacklist: "<tg-emoji emoji-id=5382187118216879236>❓</tg-emoji> <b>Кого розблокувати? Вкажіть числовий ID користувача або дайте відповідь на його повідомлення (@username не підтримується)</b>"
  _cmd_doc_addalias: "<аліас>[, аліас...] <команда> [аргументи] - Створити аліас. Команду вказуйте без префікса. Приклад: addalias h help або addalias h, hlp && help -f"
  _cmd_doc_aliases: "Показати список аліасів"
  _cmd_doc_blacklist: "[ID чату] [модуль] - Заборонити юзерботу (або лише модулю) реагувати в чаті, за замовчуванням у поточному. ID можна вказувати з -100. У заблокованому чаті перестають працювати й ваші команди, тому зняти блокування можна лише з іншого чату: unblacklist <ID чату>"
  _cmd_doc_blacklistuser: "[ID|відповідь] - Заборонити користувачу виконувати команди. Без аргументу — автор повідомлення, на яке ви відповіли, або співрозмовник в особистих повідомленнях. @username не підтримується"
  _cmd_doc_cleardb: "Повністю очистити базу даних (скидання до заводських налаштувань)"
  _cmd_doc_delalias: "<аліас>[, аліас...] | -c|--clear - Видалити аліаси (через кому) або одразу всі з -c (без підтвердження!)"
  _cmd_doc_heroku: "Показати версію Heroku"
  _cmd_doc_setprefix: "<префікс> [@юзер|ID|відповідь] - Змінити префікс команд. Без цілі змінює ваш основний префікс; із ціллю задає особистий префікс користувачу, який має доступ до юзербота (відповідь на повідомлення стороннього змінює ВАШ префікс)"
  _cmd_doc_setprefixes: "<префікс> [префікс ...] [--user @юзер|ID] - Замінити всі префікси команд (перший — основний). З --user або відповіддю на повідомлення задає особисті префікси іншому користувачу"
  _cmd_doc_togglecmd: "<модуль> <команда> або <команда> - Увімкнути або вимкнути команду (повторний виклик знову вмикає її)"
  _cmd_doc_togglemod: "<модуль> - Увімкнути або вимкнути весь модуль (повторний виклик знову вмикає його). Модуль Settings вимкнути не можна"
  _cmd_doc_clearmodule: "<модуль> - Видалити всі дані й конфіг модуля з бази (також знімає вимкнення модуля та його команд)"
  _cmd_doc_unblacklist: "[ID чату] [модуль] - Зняти блокування юзербота (або модуля) у чаті, за замовчуванням у поточному. ID можна вказувати з -100"
  _cmd_doc_unblacklistuser: "[ID|відповідь] - Дозволити користувачу виконувати дозволені команди. Без аргументу — автор повідомлення, на яке ви відповіли, або співрозмовник в особистих повідомленнях. @username не підтримується"

