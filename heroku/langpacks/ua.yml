  _cmd_doc_owneradd: "[-f|--force] [-n|--nonick] [-p|--prefix <префікс>]... <@юзернейм|ID|відповідь> - Додати власника (повний доступ до юзербота)\nПрапорці: -f — без вікна підтвердження, -n — одразу увімкнути NoNick, -p — особистий префікс (можна повторювати)"
