  wrong_usage_tcc: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Використання:</b> <code>{prefix}togglecmd &lt;модуль&gt; &lt;команда&gt;</code> <b>або</b> <code>{prefix}togglecmd &lt;команда&gt;</code>"
  wrong_usage_tmc: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Використання:</b> <code>{prefix}togglemod &lt;модуль&gt;</code>"
  wrong_usage_cmc: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Використання:</b> <code>{prefix}clearmodule &lt;модуль&gt;</code>"
  cmc_done: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>Дані модуля</b> <code>{}</code> <b>видалено з бази</b>"
