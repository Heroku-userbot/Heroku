  _cmd_doc_security: "[команда без префікса] - Налаштувати, хто може використовувати команду. Без аргументу — глобальні обмеження для всіх команд"
  _cmd_doc_tsec: "<user|chat|sgroup> [ціль] <правило> [час] - Надати доступ до команди або модуля. Без аргументів — список правил\nЦіль: user — @юзернейм (обов'язково з @) або ID, відповідь на повідомлення або ОП; chat — поточний чат, @юзернейм або ID чату (підходять і -100…); sgroup — назва групи безпеки\nПравило — назва команди (без аліасів) або модуля\nЧас: 30s, 10m, 2h, 1d, 1w, можна поєднувати: 1d12h або 1d 12h; без часу — назавжди\nПриклади: .tsec user @vasya ban 1d, .tsec chat weather 1d12h, .tsec sgroup friends Loader"
  _cmd_doc_tsecclr: "<user|chat|sgroup> [@юзернейм|ID|назва групи] - Видалити всі таргетовані правила цілі\nuser: @юзернейм/ID, відповідь на повідомлення або ОП; chat: виконайте в потрібному чаті; sgroup: назва групи безпеки\nПриклади: .tsecclr user @vasya, .tsecclr chat, .tsecclr sgroup friends"
  _cmd_doc_tsecrm: "<user|chat|sgroup> [ціль] <правило> - Видалити таргетоване правило. Назву правила пишіть так, як її показано в .tsec (підійде й назва модуля або команди)\nuser: @юзернейм/ID, відповідь на повідомлення або ОП; chat: виконайте в самому чаті (не в ОП); sgroup: назва групи безпеки\nПриклади: .tsecrm user @vasya ban, .tsecrm chat Loader, .tsecrm sgroup friends ban"
