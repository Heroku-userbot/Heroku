loader_restrictor:
  q1: "Який доступ до вашого акаунта отримує будь-який встановлений модуль?"
  q1_ans1: "Обмежений: лише те, що автор зазначив в описі модуля"
  q1_ans2: "Лише до чату, у якому ви викликали його команду"
  q1_ans3: "Жодного, доки ви самі не викличете якусь із його команд"
  q1_ans4: "Повний, як у вас: усі чати, контакти, подарунки, зірки"
  q1_hint: "Модуль діє як ви: читає всі чати, працює у фоні, витрачає зірки, передає подарунки. Вбудований захист ловить лише прості спроби, його можна обійти — не покладайтеся на нього, перевіряйте код."
  q2: "Незнайомець надіслав свій модуль і просить його протестувати. Що ви зробите?"
  q2_ans1: "Одразу встановлю: людина просить допомогти, а відмовляти незручно"
  q2_ans2: "Перевірю код або покажу в чаті підтримки з позначкою #check_scam"
  q2_ans3: "Спитаю автора, чи безпечний модуль, і повірю йому на слово"
  q2_ans4: "Встановлю його на другий акаунт у цьому ж юзерботі, так безпечніше"
  q2_hint: "«Модуль на тест» в особистих — часта схема крадіжки акаунтів. Другий акаунт у тому ж юзерботі не врятує: модуль отримає доступ до всього. Сумніви? Покажіть його в <a href=\"https://t.me/heroku_talks\">@heroku_talks</a> з тегом #check_scam."
  q3: "Чи може модуль працювати з файлами на сервері або пристрої, де запущено юзербот?"
  q3_ans1: "Ні, модуль бачить лише Telegram і не може чіпати жодних інших файлів"
  q3_ans2: "Лише якщо Telegram видасть йому окремий дозвіл"
  q3_ans3: "Так, може читати, змінювати й видаляти файли, навіть файл сесії"
  q3_ans4: "Лише з фото й відео, завантаженими з Telegram"
  q3_hint: "Юзербот — програма на Python, а модуль — її частина з тими самими правами. Він може прочитати файл сесії — ключ до вашого акаунта. Telegram про модулі нічого не знає."
  q4: "Модуль без вашого відома надіслав листування й файл сесії на чужий сервер. Що ви, найімовірніше, побачите?"
  q4_ans1: "Попередження від Telegram про підозрілу активність модуля"
  q4_ans2: "Помилки й підозрілі записи від цього модуля в логах юзербота"
  q4_ans3: "Повідомлення захисту юзербота, що надсилання даних заблоковано"
  q4_ans4: "Нічого, модуль працює у фоні й не зобов'язаний лишати слідів"
  q4_hint: "Telegram не бачить, що модуль робить на сервері, а в логи модуль пише що захоче. Вбудований захист ловить лише прості спроби, його можна обійти — не покладайтеся на нього, перевіряйте код."
  timeout: "<tg-emoji emoji-id=5447644880824181073>⚠️</tg-emoji> <b>Час на питання (60 секунд) вичерпано. Щоб почати знову, надішліть у цей чат</b> <code>/start lm_verify</code>"
  failed: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Відповідь неправильна — пояснення є в опитуванні вище (значок 💡). Перевірка почнеться з першого питання, спроб скільки завгодно: надішліть у цей чат</b> <code>/start lm_verify</code>"
  already_passed: "<tg-emoji emoji-id=5118861066981344121>✅</tg-emoji> <b>Ви вже пройшли перевірку — встановлення модулів розблоковано</b>"
  unlocked: "<tg-emoji emoji-id=5118861066981344121>✅</tg-emoji> <b>Перевірку пройдено, встановлення модулів розблоковано. Якщо встановлення було заблоковано, повторіть команду.</b>"
  unlock_prompt: "<tg-emoji emoji-id=5447644880824181073>⚠️</tg-emoji> <b>Встановлення модулів заблоковано.</b> Щоб розблокувати його, дайте відповідь на 4 питання про безпеку: на кожне 60 секунд, у разі помилки перевірка почнеться знову. Перескладати можна скільки завгодно."
  unlock_prompt_btn: "Почати перевірку (4 питання)"
  name: "LoaderRestrictor"
  _cls_doc: "Перевірка знань про безпеку перед встановленням модулів"

