settings:
  choose_installation: "<tg-emoji emoji-id=5363805650327450240>🪐</tg-emoji> <b>Виберіть варіант установки Heroku:</b>"
  vds_install: "<tg-emoji emoji-id=5471952986970267163>💎</tg-emoji> Процес встановлення на VDS виконується однією командою:\n<pre><code class=\"language-shell\">sudo apt update &amp;&amp; sudo apt upgrade -y &amp;&amp; sudo apt install -y git python3-pip &amp;&amp; git clone https://github.com/Heroku-userbot/Heroku &amp;&amp; cd Heroku &amp;&amp; pip install -r requirements.txt &amp;&amp; python3 -m heroku</code></pre>\n<i>Примітка: якщо у вас немає прав sudo, пропустіть відповідну частину команди.</i>"
  wsl_install: "<b>Встановіть WSL.</b> Для цього відкрийте PowerShell від імені адміністратора й виконайте <code>wsl --install -d Ubuntu-22.04</code> \n⚠️ <i>Для встановлення WSL потрібна Windows 10 збірки 2004 або Windows 11 будь-якої версії та ПК з підтримкою віртуалізації. Про встановлення на старіші версії ОС читайте на</i> <a href=\"https://learn.microsoft.com/uk-ua/windows/wsl/install-manual\">цій сторінці</a>\n\n⬜️ <b>Перезавантажте ПК і запустіть застосунок Ubuntu 22.04.x</b> \n\n⬜️ <b>Вставте в нього команду (ПКМ):</b> <code>curl -Ss https://bootstrap.pypa.io/get-pip.py | python3</code> \n⚠️ <i>Якщо з'являться жовті попередження, введіть</i> <code>export PATH=\"/home/username/.local/bin:$PATH\"</code><i>, замінивши /home/username/.local/bin на шлях, зазначений у повідомленні</i>\n\n⬜️ <b>Вставте команду (ПКМ):</b> \n<pre><code class=\"language-bash\">clear &amp;&amp; git clone https://github.com/Heroku-userbot/Heroku &amp;&amp; cd Heroku &amp;&amp; pip install -r requirements.txt &amp;&amp; python3 -m heroku</code></pre>\n🔗 <b>Де отримати API_ID і API_HASH?</b>: <a href=\"https://youtu.be/DcqDA249Lhg?t=24\">Відео</a>"
  userland_install: "<b>Встановіть UserLAnd за</b> <a href=\"https://play.google.com/store/apps/details?id=tech.ula\">посиланням</a>\n\n<b>Відкрийте його, виберіть Ubuntu —&gt; Minimal —&gt; Terminal</b>\n\n<b>Дочекайтеся встановлення дистрибутива, тим часом можна налити чаю</b>\n\n<b>Після успішного встановлення відкриється термінал, введіть у нього:</b>\n<pre><code class=\"language-bash\">sudo apt update &amp;&amp; sudo apt upgrade -y &amp;&amp; sudo apt install python3 git python3-pip -y &amp;&amp; git clone https://github.com/Heroku-userbot/Heroku &amp;&amp; cd Heroku &amp;&amp; sudo pip install -r requirements.txt &amp;&amp; python3 -m heroku</code></pre>\n\n<b>Наприкінці встановлення з'явиться посилання, перейдіть за ним і введіть дані свого акаунта для входу.\n\nВуаля! Ви встановили Heroku на UserLAnd.</b>"
  hikkahost_install: "<b>🌘 Як встановити Heroku на HikkaHost?</b>\n\n1. Перейдіть до @hikkahost_bot\n2. Виберіть \"Установить\"\n3. Виберіть \"🪐 Heroku\"\n\nІ продовжуйте встановлення.\n\n<b>Після цього ви отримаєте посилання, відкрийте його та увійдіть у свій акаунт.</b>"
  too_many_args: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Неправильні аргументи. Формат:</b> <code>{prefix}{cmd} [ID чату] [модуль]</code>"
  blacklisted: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>Чат {} додано до чорного списку юзербота</b>"
  unblacklisted: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>Чат {} видалено з чорного списку юзербота</b>"
  user_blacklisted: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>Користувача {} додано до чорного списку юзербота</b>"
  user_unblacklisted: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>Користувача {} видалено з чорного списку юзербота</b>"
  what_prefix: "<tg-emoji emoji-id=5870609858520158157>ℹ</tg-emoji> <b>Вкажіть префікс.</b>\n<code>setprefix !</code>\n<code>setprefix ! @user</code>"
  what_prefixes: "<tg-emoji emoji-id=5870609858520158157>ℹ</tg-emoji> <b>Вкажіть префікси через пробіл (перший стане основним).</b>\n<code>setprefixes ! .</code>\n<code>setprefixes --user ID ! .</code>"
  prefix_incorrect: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Префікс має бути одним символом без пробілів (не можна «s»). Для довших префіксів та емодзі увімкніть</b> <code>allow_nonstandart_prefixes</code> <b>у</b> <code>config Settings</code>"
  prefix_set: "{} <b>Префікс команд змінено. Повернути попередній:</b>\n<pre><code class=\"language-heroku\">{newprefix}setprefix {oldprefix}</code></pre>"
  prefixes_set: "{} <b>Префікси команд замінено. Повернути попередні:</b>\n<pre><code class=\"language-heroku\">{newprefix}setprefixes {oldprefix}</code></pre>"
  entity_prefix_set: "{} <b>Префікс команд для {entity_name} змінено. Повернути попередній:</b>\n<pre><code class=\"language-heroku\">{newprefix}setprefix {oldprefix} {entity_id}</code></pre>"
  entity_prefixes_set: "{} <b>Префікси команд для {entity_name} замінено. Повернути попередні:</b>\n<pre><code class=\"language-heroku\">{newprefix}setprefixes --user {entity_id} {oldprefix}</code></pre>"
  id_not_found_scgroup: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Цей користувач не має доступу до юзербота, тому особистий префікс йому ні до чого. Спочатку надайте доступ:</b> <code>sgroupadd</code>, <code>owneradd</code> <b>або</b> <code>tsec</code>"
  invalid_id_or_username: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Користувача</b> <code>{}</code> <b>не знайдено. Якщо ви хотіли задати кілька префіксів, використовуйте</b> <code>setprefixes</code>"
  alias_created: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>Аліас створено. Використовуйте його через</b> <code>{}</code>"
  aliases_created: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>Додано аліасів: {count}</b>\n<blockquote expandable>{aliases}</blockquote>"
  aliases_created_line: "{aliases} для {command}"
  unstable: "\n\n<tg-emoji emoji-id=5355133243773435190>❕</tg-emoji> <b>Ви використовуєте нестабільну гілку</b> <code>{}</code><b>!</b>"
  aliases: "<b>🔗 Аліаси:</b>\n"
  happy_beta: "\n\n<tg-emoji emoji-id=5465188915990255885>🌟</tg-emoji> <b>Ви щасливий володар версії <code>{}</code>!</b>"
  no_command: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Команду</b> <code>{}</code> <b>не знайдено (вказуйте без префікса)</b>"
  alias_exists: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Аліас</b> <code>{alias}</code> <b>уже зайнятий командою</b> <code>{command}</code><b>. Видаліть його через</b> <code>delalias {alias}</code>"
  alias_args: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Вкажіть аліас і команду:</b> <code>{prefix}addalias h help</code>"
  delalias_args: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Вкажіть аліас:</b> <code>{prefix}delalias &lt;аліас&gt;[, аліас...]</code> <b>або</b> <code>{prefix}delalias -c</code> <b>для видалення всіх</b>"
  alias_removed: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>Аліас</b> <code>{}</code> <b>видалено</b>."
  aliases_removed: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>Видалено аліасів: {count}</b>\n<blockquote expandable>{aliases}</blockquote>"
  aliases_cleared: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>Усі аліаси видалено</b>."
  no_alias: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Аліаса</b> <code>{}</code> <b>не існує</b>"
  db_cleared: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>Базу очищена</b>"
  heroku: "{} <b>{}.{}.{}</b> <i>{}</i>\n\n<tg-emoji emoji-id=5289608677244811430>📁</tg-emoji> <b>heroku-tl:</b> <i>{}</i>\n\n<tg-emoji emoji-id=5228879218363872764>⌨</tg-emoji> <b>Розробник: <a href=\"https://t.me/zetgo\">@zetgo</a></b>"
  rich_heroku_message: '<figure><img src="{banner_url}"/></figure><h1>{platform} Userbot</h1><table bordered><tr><th>Компонент</th><th>Поточний реліз</th></tr><tr><td><b>Версія</b></td><td><code>{version}</code></td></tr><tr><td><b>Збірка</b></td><td>{build}</td></tr><tr><td><b>Heroku TL</b></td><td><code>{htl_version}</code></td></tr><tr><td><b>Шар API</b></td><td><code>{layer}</code></td></tr><tr><td><b>Поточний користувач</b></td><td><code>{current_user}</code></td></tr><tr><td><b>Розробник</b></td><td><a href="https://t.me/zetgo">@zetgo</a></td></tr></table>'
  _cfg_rich_mode: "Показувати Heroku як Rich-повідомлення."
  _cls_doc: "Керування базовими налаштуваннями юзербота"
  confirm_cleardb: "⚠️ <b>Буде видалено ВСІ налаштування: префікси, аліаси, конфіги та дані модулів. Продовжити?</b>"
  cleardb_confirm: "🗑 Очистити базу"
