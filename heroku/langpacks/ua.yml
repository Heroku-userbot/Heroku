  _cmd_doc_e: "[-so] [код] - Виконати Python-код. Код можна вказати після команди, відповіддю на повідомлення з кодом або текстовим файлом (у своєму повідомленні чи в тому, на яке ви відповідаєте). Прапорці: -so (--skip-output) - виконати без відповіді, показуються лише помилки. Доступні: m/message, r/reply, c/client, chat, db, utils, self."
  _cmd_doc_ec: "[код] - Скомпілювати (gcc) і виконати C-код. Код - після команди або відповіддю на повідомлення з кодом. Ліміти: компіляція 30 с, виконання 10 с; введення (stdin) недоступне."
  _cmd_doc_ecpp: "[код] - Скомпілювати (g++) і виконати C++-код. Код - після команди або відповіддю на повідомлення з кодом. Ліміти: компіляція 30 с, виконання 10 с; введення (stdin) недоступне."
  _cmd_doc_ers: "[код] - Скомпілювати (rustc) і виконати Rust-код. Код - після команди або відповіддю на повідомлення з кодом. Ліміти: компіляція 30 с, виконання 10 с; введення (stdin) недоступне."
  _cmd_doc_eg: "[код] - Виконати Go-код (go run). Код - після команди або відповіддю на повідомлення з кодом. Ліміт: 30 с; введення (stdin) недоступне."
  _cmd_doc_enode: "[код] - Виконати JavaScript-код у Node.js. Код - після команди або відповіддю на повідомлення з кодом. Ліміт: 10 с; введення (stdin) недоступне."

