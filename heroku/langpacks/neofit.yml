loader_restrictor:
  name: "LoaderRestrictor"
  q1: "What's the actual access scope of any module you install?"
  q1_ans1: "Limited: only what the author declared in its docstring"
  q1_ans2: "Scoped to the chat where you invoked its command"
  q1_ans3: "None until you explicitly call one of its commands"
  q1_ans4: "Full, same as you: all chats, contacts, gifts, Stars"
  q1_hint: "A module runs as you: reads every chat, runs in the background, spends Stars and gifts. Built-in guardrails only catch simple attempts and can be bypassed. Don't rely on them, review the code."
  q2: "A stranger DMs you their module and asks you to test-run it. What do you do?"
  q2_ans1: "Install right away: they asked for help, saying no is awkward"
  q2_ans2: "Review the code or show it in support chat with #check_scam"
  q2_ans3: "Ask the author if it's safe and take their word for it"
  q2_ans4: "Deploy to a second account on the same userbot, that's safer"
  q2_hint: "A module \"to test\" in DMs is a classic account-theft trick. A second account on the same userbot won't help: the module gets access to everything. Unsure? Show it in <a href=\"https://t.me/heroku_talks\">@heroku_talks</a> with #check_scam."
  q3: "Does a module get access to files on the host/device running the userbot?"
  q3_ans1: "No, it's sandboxed to Telegram, zero file access on the device"
  q3_ans2: "Only with an explicit separate Telegram grant"
  q3_ans3: "Yes: read, write, delete files, even the session file"
  q3_ans4: "Only photos/videos downloaded from Telegram"
  q3_hint: "The userbot is a Python process, a module runs inside it with the same rights. It can read the session file, the key to your account. Telegram knows nothing about modules."
  q4: "A module silently exfiltrated your chats and session file to a third-party server. What will you most likely see?"
  q4_ans1: "A Telegram security alert about the module's activity"
  q4_ans2: "Errors and suspicious module entries in the userbot logs"
  q4_ans3: "A userbot protection notice that the upload was blocked"
  q4_ans4: "Nothing: it runs in the background, no traces needed"
  q4_hint: "Telegram can't see what a module does on the host, and a module logs only what it wants. Built-in guardrails only catch simple attempts and can be bypassed. Don't rely on them, review the code."
  timeout: "<tg-emoji emoji-id=5447644880824181073>⚠️</tg-emoji> <b>TimeoutError: 60 s per question expired. Restart: send</b> <code>/start lm_verify</code> <b>in this chat</b>"
  failed: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>AssertionError: wrong answer, see the explanation in the poll above (💡 icon). Check restarts from Q1, unlimited retries: send</b> <code>/start lm_verify</code> <b>in this chat</b>"
  already_passed: "<tg-emoji emoji-id=5118861066981344121>✅</tg-emoji> <b>Check already passed, module install permission granted</b>"
  unlocked: "<tg-emoji emoji-id=5118861066981344121>✅</tg-emoji> <b>Check passed, module install permission granted. Install was blocked? Rerun the command.</b>"
  unlock_prompt: "<tg-emoji emoji-id=5447644880824181073>⚠️</tg-emoji> <b>PermissionError: module installs locked.</b> Unlock: 4 safety questions, 60 s each, a mistake restarts the check. Unlimited retries."
  unlock_prompt_btn: "Run check() (4 questions)"
  _cls_doc: "Mandatory safety check before module installs"

