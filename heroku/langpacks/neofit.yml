  vds_install: "<tg-emoji emoji-id=5471952986970267163>💎</tg-emoji> VDS Script:\n<pre><code class=\"language-shell\">sudo apt update &amp;&amp; sudo apt upgrade -y &amp;&amp; sudo apt install -y git python3-pip &amp;&amp; git clone https://github.com/Heroku-userbot/Heroku &amp;&amp; cd Heroku &amp;&amp; pip install -r requirements.txt &amp;&amp; python3 -m heroku</code></pre>\n<i>Note: no sudo rights? Drop the sudo parts.</i>"
  wsl_install: "<b>WSL Setup.</b> PowerShell (Admin): <code>wsl --install -d Ubuntu-22.04</code> \n⚠️ <i>Req: Win 10 2004+ / Win 11 + Virt. Older OS:</i> <a href=\"https://learn.microsoft.com/en-us/windows/wsl/install-manual\">Docs</a>\n\n⬜️ <b>Reboot, launch Ubuntu 22.04.x</b> \n\n⬜️ <b>Paste (RMB):</b> <code>curl -Ss https://bootstrap.pypa.io/get-pip.py | python3</code> \n⚠️ <i>Yellow warnings?</i> <code>export PATH=\"/home/username/.local/bin:$PATH\"</code> <i>(use the path from the warning)</i>\n\n⬜️ <b>Deploy (RMB):</b> \n<pre><code class=\"language-bash\">clear &amp;&amp; git clone https://github.com/Heroku-userbot/Heroku &amp;&amp; cd Heroku &amp;&amp; pip install -r requirements.txt &amp;&amp; python3 -m heroku</code></pre>\n🔗 <b>API_ID / API_HASH:</b> <a href=\"https://youtu.be/DcqDA249Lhg?t=24\">Tutorial</a>"
  userland_install: "<b>Get UserLAnd:</b> <a href=\"https://play.google.com/store/apps/details?id=tech.ula\">Google Play</a>\n\n<b>Env: Ubuntu —&gt; Minimal —&gt; Terminal</b>\n\n<b>Wait for init...</b>\n\n<b>Run:</b>\n<pre><code class=\"language-bash\">sudo apt update &amp;&amp; sudo apt upgrade -y &amp;&amp; sudo apt install python3 git python3-pip -y &amp;&amp; git clone https://github.com/Heroku-userbot/Heroku &amp;&amp; cd Heroku &amp;&amp; sudo pip install -r requirements.txt &amp;&amp; python3 -m heroku</code></pre>\n\n<b>Open the link at the end, log in.\n\nDone: Heroku on UserLAnd.</b>"
  hikkahost_install: "<b>🌘 Deploy HikkaHost:</b>\n\n1. @hikkahost_bot\n2. Install\n3. 🪐 Heroku\n\n<b>Exec instructions.</b>"
