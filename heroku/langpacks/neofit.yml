loader_restrictor:
  name: "LoaderRestrictor"
  q1: "What's the actual permission scope of any module you install?"
  q1_ans1: "Exactly what's declared in its docstring, nothing more"
  q1_ans2: "Read-only, scoped to the chat it was invoked in"
  q1_ans3: "Executes only on explicit function call"
  q1_ans4: "Same as root: full read/write on your Telegram account, including account deletion"
  q1_hint: "Base image has some guardrails, but a module can still escalate to full account access"
  q2: "Unknown user DMs you, asks you to test-run their module. git pull and execute?"
  q2_ans1: "Sure, why not"
  q2_ans2: "Code review first (manual/LLM). If unclear: report to support with #check_scam, tag the source"
  q2_ans3: "Ask the author for a signed guarantee, trust it"
  q2_ans4: "Deploy to a throwaway account first - sandboxed, safer"
  q2_hint: "Anything outside the official registry needs a code review before merge. No exceptions"
  q3: "Does a module get filesystem/OS access on the host, or is it sandboxed to the Telegram API?"
  q3_ans1: "Sandboxed - no filesystem access outside the Telegram API"
  q3_ans2: "Only with an explicit Telegram grant"
  q3_ans3: "No sandbox - it's an in-process import: full read/write/delete on the filesystem"
  q3_ans4: "Media files only"
  q3_hint: "The userbot is just a Python process on your host. A module runs in that same process, same permissions"
  q4: "Would stdout/logs show it if a module started acting without authorization (exfil, etc.)?"
  q4_ans1: "Yes, Telegram would push a security alert"
  q4_ans2: "Yes, I'd catch it in the logs"
  q4_ans3: "No, but the base sandboxing should catch it"
  q4_ans4: "Not guaranteed - it can run silently, no log output, until it's too late"
  q4_hint: "Silent failure is the real threat model here: no code review means no early warning, only post-mortem"
  timeout: "<tg-emoji emoji-id=5447644880824181073>⚠️</tg-emoji> <b>TimeoutError: quiz not completed in time. Retry:</b> <code>/start lm_verify</code>"
