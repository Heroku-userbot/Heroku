loader_restrictor:
  name: "LoaderRestrictor"
  q1: "What can any module you install actually do?"
  q1_ans1: "Exactly what its description says - nothing more"
  q1_ans2: "Read messages only in the chat where it was called"
  q1_ans3: "Act only when you explicitly call its command"
  q1_ans4: "The same as you in Telegram, and more: sending gifts, deleting your account"
  q1_hint: "Although the userbot has basic protection against dangerous requests, a module can still gain full control of your account"
  q2: "A stranger messages you and asks you to test their module. What do you do?"
  q2_ans1: "Sure, why not help them?"
  q2_ans2: "Check the code myself/with AI. If unsure, report with #check_scam"
  q2_ans3: "Ask the author if it's safe and take their word for it"
  q2_ans4: "Install it on another account to test it - that's safer"
  q2_hint: "Any module not from official developer channels should be checked for dangerous code. Don't put yourself at risk!"
  q3: "Can a module work with the files and system of the server/hosting, not just Telegram?"
  q3_ans1: "No, a module only works inside Telegram and can't see other files"
  q3_ans2: "Only if it has a separate permission from Telegram"
  q3_ans3: "Yes - a module is part of the userbot: it can read, change, delete files"
  q3_ans4: "Only photos and videos from Telegram"
  q3_hint: "The userbot is a Python program running on your server. A module is part of that same program, with the same rights"
  q4: "Would you notice if a module started acting without your permission (data theft, etc.)?"
  q4_ans1: "Yes, Telegram would immediately notify me about suspicious activity"
  q4_ans2: "Yes, I'd notice suspicious logs from the module"
  q4_ans3: "No, but the userbot's basic protection should catch such activity"
  q4_ans4: "Not necessarily - a module can act invisibly, without any notifications, until it's too late"
  q4_hint: "Stealth is the main danger of malicious modules: without checking the code beforehand, you might simply not notice a problem until it's too late"
  timeout: "<tg-emoji emoji-id=5447644880824181073>⚠️</tg-emoji> <b>You didn't answer all the questions in time. You can try again by sending</b> <code>/start lm_verify</code>"
  failed: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Wrong answer. To unlock third-party module installation, try again by sending</b> <code>/start lm_verify</code>"
