  _cmd_doc_ml: "<module> - Sends the module file (by name or class name; if there is no exact match, the closest one is sent)"
  verify_required: '<tg-emoji emoji-id=5188463524568926712>⚠️</tg-emoji> <b>Module installation is locked until you pass a short check (4 safety questions) in <a href="https://t.me/{}?start=lm_verify">your bot</a></b>'
loader_restrictor:
  name: "LoaderRestrictor"
  _cls_doc: "Safety check required before installing modules"
  q1: "What access to your account does any installed module get?"
  q1_ans1: "Limited: only what the author listed in the module's description"
  q1_ans2: "Only the chat where you called its command"
  q1_ans3: "None until you call one of its commands yourself"
  q1_ans4: "Full, like yours: all chats, contacts, gifts, Stars"
  q1_hint: "A module acts as you: it reads every chat, runs in the background, spends Stars and gifts. Built-in protection only catches simple attempts and can be bypassed. Don't rely on it, check the code."
  q2: "A stranger sends you their module and asks you to test it. What do you do?"
  q2_ans1: "Install it right away: they asked for help, and saying no is awkward"
  q2_ans2: "Check the code or show it in the support chat tagged #check_scam"
  q2_ans3: "Ask the author if it's safe and take their word for it"
  q2_ans4: "Install it on a second account in the same userbot, that's safer"
  q2_hint: "A module \"to test\" in DMs is a common account-theft trick. A second account in the same userbot won't help: the module gets access to everything. Unsure? Show it in <a href=\"https://t.me/heroku_talks\">@heroku_talks</a> tagged #check_scam."
  q3: "Can a module work with files on the server or device where the userbot runs?"
  q3_ans1: "No, a module only sees Telegram and can't touch any files on the device"
  q3_ans2: "Only if Telegram grants it a separate permission"
  q3_ans3: "Yes, it can read, change and delete files, even the session file"
  q3_ans4: "Only photos and videos downloaded from Telegram"
  q3_hint: "The userbot is a Python program and a module is part of it with the same rights. It can read the session file, the key to your account. Telegram knows nothing about modules."
  q4: "A module quietly sent your chats and session file to someone else's server. What will you most likely see?"
  q4_ans1: "A warning from Telegram about the module's suspicious activity"
  q4_ans2: "Errors and suspicious entries from the module in the userbot logs"
  q4_ans3: "A message from the userbot's protection that sending data was blocked"
  q4_ans4: "Nothing, the module runs in the background and needn't leave traces"
  q4_hint: "Telegram can't see what a module does on the server, and a module logs only what it wants. Built-in protection only catches simple attempts and can be bypassed. Don't rely on it, check the code."
  timeout: "<tg-emoji emoji-id=5447644880824181073>⚠️</tg-emoji> <b>Time for the question (60 seconds) is up. To start over, send</b> <code>/start lm_verify</code> <b>in this chat</b>"
  failed: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Wrong answer — see the explanation in the poll above (💡 icon). The check restarts from the first question, retries are unlimited: send</b> <code>/start lm_verify</code> <b>in this chat</b>"
  already_passed: "<tg-emoji emoji-id=5118861066981344121>✅</tg-emoji> <b>You've already passed the check — module installation is unlocked</b>"
  unlock_prompt: "<tg-emoji emoji-id=5447644880824181073>⚠️</tg-emoji> <b>Module installation is locked.</b> To unlock it, answer 4 safety questions: 60 seconds each, a mistake restarts the check. You can retry as many times as you like."
  unlock_prompt_btn: "Start the check (4 questions)"
  unlocked: "<tg-emoji emoji-id=5118861066981344121>✅</tg-emoji> <b>Check passed, module installation is unlocked. If an install was blocked, run the command again.</b>"
