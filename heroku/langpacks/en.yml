settings:
  name: "Settings"
  vds: "💎 VDS"
  wsl: "💻 WSL"
  userland: "🐧 UserLand"
  hikkahost: "🌼 HikkaHost"
  choose_installation: "<tg-emoji emoji-id=5363805650327450240>🪐</tg-emoji> <b>Choose your Heroku installation option:</b>"
  vds_install: "<tg-emoji emoji-id=5471952986970267163>💎</tg-emoji> The installation process on a VDS is done with a single command:\n<pre><code class=\"language-shell\">sudo apt update &amp;&amp; sudo apt upgrade -y &amp;&amp; sudo apt install git python3-pip &amp;&amp; git clone https://github.com/Heroku-userbot/Heroku &amp;&amp; cd Heroku &amp;&amp; pip install -r requirements.txt &amp;&amp; python3 -m heroku</code></pre>\n<i>Note: If you do not have sudo privileges, omit the corresponding part of the command.</i>"
  wsl_install: "<b>Download WSL.</b> To do this, open PowerShell as administrator and type <code>wsl --install -d Ubuntu-22.04</code> \n⚠️ <i>To install WSL, you need Windows 10 build 2004 or Windows 11 of any version and a PC with virtualization support. For installation on earlier versions of the OS, refer to</i> <a href=\"https://learn.microsoft.com/ru-ru/windows/wsl/install-manual\">this page</a>\n\n⬜️ <b>Restart your PC and launch the Ubuntu 22.04.x application</b> \n\n⬜️ <b>Paste the command into it (RMB):</b> <code>curl -Ss https://bootstrap.pypa.io/get-pip.py | python3</code> \n⚠️ <i>If yellow warnings appear, type</i> <code>export PATH=\"/home/username/.local/bin:$PATH\"</code> <i>replacing /home/username/.local/bin with the path mentioned in the message</i>\n\n⬜️ <b>Paste the command (RMB):</b> \n<pre><code class=\"language-bash\">clear &amp;&amp; git clone https://github.com/Heroku-userbot/Heroku &amp;&amp; cd Heroku &amp;&amp; pip install -r requirements.txt &amp;&amp; python3 -m heroku</code></pre>\n🔗 <b>Where to get API_ID and API_HASH?</b>: <a href=\"https://youtu.be/DcqDA249Lhg?t=24\">Video</a>"
  userland_install: "<b>Install UserLAnd from this</b> <a href=\"https://play.google.com/store/apps/details?id=tech.ula\">link</a>\n\n<b>Open it, select Ubuntu —&gt; Minimal —&gt; Terminal</b>\n\n<b>Wait for the distribution to install, you can pour some tea</b>\n\n<b>After successful installation, a terminal will open in front of you, type there:</b>\n<pre><code class=\"language-bash\">sudo apt update &amp;&amp; sudo apt upgrade -y &amp;&amp; sudo apt install python3 git python3-pip -y &amp;&amp; git clone https://github.com/Heroku-userbot/Heroku &amp;&amp; cd Heroku &amp;&amp; sudo pip install -r requirements.txt &amp;&amp; python3 -m heroku</code></pre>\n\n<b>At the end of the installation, a link will appear, follow it and enter your account details to log in.\n\nVoilà! You have installed Heroku on UserLAnd.</b>"
  hikkahost_install: "<b>🌘 How to install Heroku on HikkaHost?</b>\n\n1. Go to @hikkahost_bot\n2. Select \"Install\"\n3. Select \"🪐 Heroku\"\n\nAnd continue with the installation.\n\n<b>After that, you will receive a link, open it and log into your account.</b>"
  too_many_args: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Invalid arguments. Format:</b> <code>{prefix}{cmd} [chat ID] [module]</code>"
