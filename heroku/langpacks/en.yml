  _cmd_doc_tsec: "<user|chat|sgroup> [target] <rule> [time] - Grant access to a command or module. Without arguments — list of rules\nTarget: user — @username (the @ is required) or ID, reply to a message or PM; chat — current chat, @username or chat ID (-100… also works); sgroup — security group name\nRule — command name (no aliases) or module name\nTime: 30s, 10m, 2h, 1d, 1w, can be combined: 1d12h or 1d 12h; no time means forever\nExamples: .tsec user @vasya ban 1d, .tsec chat weather 1d12h, .tsec sgroup friends Loader"
  _cmd_doc_tsecclr: "<user|chat|sgroup> [@username|ID|group name] - Clear all targeted rules of the target\nuser: @username/ID, reply to a message or PM; chat: run in the chat itself; sgroup: security group name\nExamples: .tsecclr user @vasya, .tsecclr chat, .tsecclr sgroup friends"
  _cmd_doc_tsecrm: "<user|chat|sgroup> [target] <rule> - Remove a targeted rule. Write the rule as shown in .tsec (module or command name also works)\nuser: @username/ID, reply to a message or PM; chat: run in the chat itself (not in PM); sgroup: security group name\nExamples: .tsecrm user @vasya ban, .tsecrm chat Loader, .tsecrm sgroup friends ban"
