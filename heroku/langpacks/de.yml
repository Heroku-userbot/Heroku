  id_not_found_scgroup: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Dieser Benutzer hat keinen Zugriff auf den Userbot, daher ist ein persönliches Präfix für ihn nutzlos. Gewähren Sie zuerst Zugriff:</b> <code>sgroupadd</code>, <code>owneradd</code> <b>oder</b> <code>tsec</code>"
