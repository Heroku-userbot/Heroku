  what_prefix: "<tg-emoji emoji-id=5870609858520158157>ℹ</tg-emoji> <b>Präfixe durch Leerzeichen trennen.</b>\n<code>setprefix 1 ! .</code>\n<code>setprefix ! . @user</code>\n<code>setprefix --user ID ! .</code>"
