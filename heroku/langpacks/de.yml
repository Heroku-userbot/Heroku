  prefix_set: "{} <b>Der Befehlspräfix wurde aktualisiert. Verwende den folgenden Befehl, um ihn zurückzusetzen:</b>\n<pre><code class=\"language-heroku\">{newprefix}setprefix {oldprefix}</code></pre>"
