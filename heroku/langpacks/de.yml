  desc: "<tg-emoji emoji-id=5188377234380954537>🪐</tg-emoji> <b>Userbot – was ist das?</b>\n\n<tg-emoji emoji-id=5472238129849048175>😎</tg-emoji> Ein Userbot ist ein <b>Drittanbieterprogramm</b>, das über die Telegram API <b>automatisierte Aufgaben im Namen eines Benutzers</b> ausführt. Userbots können verwendet werden, um verschiedene Aufgaben zu automatisieren, wie <b>Nachrichten senden, Kanälen beitreten, Medien herunterladen und vieles mehr</b>.\n\n<tg-emoji emoji-id=5474667187258006816>😎</tg-emoji> Userbots unterscheiden sich von normalen Telegram-Bots, da <b>sie auf dem Benutzerkonto laufen</b> und nicht auf einem Bot-Konto. Dadurch haben sie Zugriff auf mehr Funktionen und sind flexibler bei den Aktionen, die sie ausführen können.\n\n<tg-emoji emoji-id=5472267631979405211>🚫</tg-emoji> Es ist jedoch wichtig zu beachten, dass <b>Userbots von Telegram nicht offiziell unterstützt werden</b> und ihre Nutzung gegen die Nutzungsbedingungen der Plattform verstoßen kann. Daher <b>sollten Benutzer beim Einsatz von Userbots vorsichtig sein</b> und sicherstellen, dass auf ihrem Konto kein Schadcode ausgeführt wird.\n\n"
  no_banner: "<tg-emoji emoji-id=6010394680179562842>😶</tg-emoji> <b>Unter dem angegebenen Link </b><code>{link}</code><b> wurde nichts gefunden.\n\nÜberprüfen Sie die Integrität Ihrer Datei unter dem Link und stellen Sie sicher, dass der Link direkt auf die Datei verweist.</b>"
  _cmd_doc_ubinfo: "Erklären, was ein Userbot ist"
  _cmd_doc_info: "Informationen zum Userbot senden (auch als Antwort auf eine Nachricht möglich). Der Text lässt sich mit config HerokuInfo ändern (Option custom_message)"

  name: HerokuInfo
  _cls_doc: Userbot-Informationen anzeigen
  _cfg_quote_media: "Das Banner als Linkvorschau statt als Anhang senden"
  _cfg_invert_media: "Banner und Text in info vertauschen"

