loader_restrictor:
  q1: "Was kann jedes von Ihnen installierte Modul tatsächlich tun?"
  q1_ans1: "Genau das, was in der Beschreibung steht – mehr nicht"
  q1_ans2: "Lesen Sie Nachrichten nur in dem Chat, in dem sie aufgerufen wurden"
  q1_ans3: "Handeln Sie nur, wenn Sie den Befehl explizit aufrufen"
  q1_ans4: "Das Gleiche wie bei Telegram und mehr: Geschenke verschicken, Konto löschen"
  q1_hint: "Obwohl der Userbot über einen grundlegenden Schutz vor gefährlichen Anfragen verfügt, kann ein Modul dennoch die volle Kontrolle über Ihr Konto erlangen"
  q2: "Ein Fremder schreibt Ihnen eine Nachricht und bittet Sie, sein Modul zu testen. Was machst du?"
  q2_ans1: "Klar, warum ihnen nicht helfen?"
  q2_ans2: "Überprüfen Sie den Code selbst/mit KI. Wenn Sie unsicher sind, melden Sie es mit #check_scam"
  q2_ans3: "Fragen Sie den Autor, ob es sicher ist, und vertrauen Sie ihm beim Wort"
  q2_ans4: "Installieren Sie es zum Testen auf einem anderen Konto – das ist sicherer"
  q2_hint: "Jedes Modul, das nicht von offiziellen Entwicklerkanälen stammt, sollte auf gefährlichen Code überprüft werden. Gehen Sie kein Risiko ein!"
  q3: "Kann ein Modul mit den Dateien und dem System des Servers/Hostings arbeiten, nicht nur mit Telegram?"
  q3_ans1: "Nein, ein Modul funktioniert nur innerhalb von Telegram und kann keine anderen Dateien sehen"
  q3_ans2: "Nur wenn es eine separate Erlaubnis von Telegram hat"
  q3_ans3: "Ja – ein Modul ist Teil des Userbots: Es kann Dateien lesen, ändern, löschen"
  q3_ans4: "Nur Fotos und Videos von Telegram"
  q3_hint: "Der Userbot ist ein Python-Programm, das auf Ihrem Server läuft. Ein Modul ist Teil desselben Programms mit denselben Rechten"
  q4: "Würden Sie es bemerken, wenn ein Modul ohne Ihre Erlaubnis agiert (Datendiebstahl usw.)?"
  q4_ans1: "Ja, Telegram würde mich sofort über verdächtige Aktivitäten informieren"
  q4_ans2: "Ja, ich würde verdächtige Protokolle vom Modul bemerken"
  q4_ans3: "Nein, aber der Grundschutz des Userbots sollte solche Aktivitäten abfangen"
  q4_ans4: "Nicht unbedingt – ein Modul kann unsichtbar und ohne Benachrichtigungen agieren, bis es zu spät ist"
  q4_hint: "Stealth ist die Hauptgefahr bösartiger Module: Ohne vorherige Überprüfung des Codes bemerken Sie ein Problem möglicherweise erst, wenn es zu spät ist"
  timeout: "<tg-emoji emoji-id=5447644880824181073>⚠️</tg-emoji> <b>Sie haben nicht alle Fragen rechtzeitig beantwortet. Sie können es erneut versuchen, indem Sie</b> <code>/start lm_verify</code> senden."
  failed: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Falsche Antwort. Um die Installation von Drittanbietermodulen freizuschalten, versuchen Sie es erneut, indem Sie</b> <code>/start lm_verify</code> senden."
