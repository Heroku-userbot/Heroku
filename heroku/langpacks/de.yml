  user_unblacklisted: "<tg-emoji emoji-id=5197474765387864959>👍</tg-emoji> <b>Benutzer {} wurde aus der Blacklist des Userbots entfernt</b>"
  what_prefix: "<tg-emoji emoji-id=5870609858520158157>ℹ</tg-emoji> <b>Geben Sie ein Präfix an.</b>\n<code>setprefix !</code>\n<code>setprefix ! @user</code>"
  what_prefixes: "<tg-emoji emoji-id=5870609858520158157>ℹ</tg-emoji> <b>Geben Sie die Präfixe durch Leerzeichen getrennt an (das erste wird zum Hauptpräfix).</b>\n<code>setprefixes ! .</code>\n<code>setprefixes --user ID ! .</code>"
