quickstart:
  base: "<tg-emoji emoji-id=5463379725441341739>🪐</tg-emoji> <b>Hallo.</b> Ihr Userbot <b>{}</b> ist jetzt installiert.\n\n<tg-emoji emoji-id=5134202243486057363>💫</tg-emoji> <b>Brauchen Sie Hilfe?</b> Treten Sie <a href=\"https://t.me/heroku_talks\">unserem Support-Chat</a> bei. Wir helfen <b>allen</b>.\n\n<tg-emoji emoji-id=4940480187436369099>💁‍♀️</tg-emoji> <b>Kurzanleitung:</b>\n\n<tg-emoji emoji-id=5456197350416486261>1️⃣</tg-emoji> <b>Schreiben Sie</b> <code>.help</code><b>, um die Liste der Module anzuzeigen</b>\n<tg-emoji emoji-id=5456261689026581678>2️⃣</tg-emoji> <b>Schreiben Sie</b> <code>.help &lt;Modulname/Befehl&gt;</code><b>, um die Beschreibung des Moduls anzuzeigen</b>\n<tg-emoji emoji-id=5458366235886522404>3️⃣</tg-emoji> <b>Schreiben Sie</b> <code>.dlmod &lt;Link&gt;</code><b>, um ein Modul über einen Link zu laden</b>\n<tg-emoji emoji-id=5456207331920483861>4️⃣</tg-emoji> <b>Schreiben Sie</b> <code>.loadmod</code> <b>als Antwort auf eine Datei, um ein Modul daraus zu laden</b>\n<tg-emoji emoji-id=5456185418997340146>5️⃣</tg-emoji> <b>Schreiben Sie</b> <code>.unloadmod &lt;Modulname&gt;</code><b>, um ein Modul zu entladen</b>\n\n<tg-emoji emoji-id=5456178297941561360>💡</tg-emoji> <b>Heroku unterstützt Module von Hikka, Friendly-Telegram und GeekTG sowie eigene Module.</b>\n"
