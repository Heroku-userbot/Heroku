loader_restrictor:
  q1: "Welchen Zugriff auf Ihr Konto erhält jedes installierte Modul?"
  q1_ans1: "Eingeschränkt: nur das, was der Autor in der Modulbeschreibung angibt"
  q1_ans2: "Nur auf den Chat, in dem Sie seinen Befehl aufgerufen haben"
  q1_ans3: "Keinen, solange Sie nicht selbst einen seiner Befehle aufrufen"
  q1_ans4: "Vollen Zugriff wie Sie: alle Chats, Kontakte, Geschenke, Stars"
  q1_hint: "Ein Modul handelt als Sie: Es liest alle Chats, läuft im Hintergrund, gibt Stars und Geschenke aus. Der eingebaute Schutz erkennt nur einfache Versuche und ist umgehbar – prüfen Sie den Code."
  q2: "Ein Fremder schickt Ihnen sein Modul und bittet Sie, es zu testen. Was tun Sie?"
  q2_ans1: "Sofort installieren: Er bittet um Hilfe, und Ablehnen ist unangenehm"
  q2_ans2: "Code prüfen oder im Support-Chat mit #check_scam zeigen"
  q2_ans3: "Den Autor fragen, ob es sicher ist, und ihm aufs Wort glauben"
  q2_ans4: "Auf einem zweiten Konto im selben Userbot installieren, das ist sicherer"
  q2_hint: "Ein „Testmodul“ im Privatchat ist ein gängiger Trick zum Kontodiebstahl. Ein Zweitkonto im selben Userbot hilft nicht: Das Modul sieht alles. Unsicher? Zeigen Sie es in <a href=\"https://t.me/heroku_talks\">@heroku_talks</a> mit #check_scam."
  q3: "Kann ein Modul mit Dateien auf dem Server oder Gerät arbeiten, auf dem der Userbot läuft?"
  q3_ans1: "Nein, ein Modul sieht nur Telegram und kann keine Dateien auf dem Gerät anfassen"
  q3_ans2: "Nur wenn Telegram ihm eine gesonderte Berechtigung erteilt"
  q3_ans3: "Ja, es kann Dateien lesen, ändern und löschen, sogar die Sitzungsdatei"
  q3_ans4: "Nur Fotos und Videos, die aus Telegram heruntergeladen wurden"
  q3_hint: "Der Userbot ist ein Python-Programm, ein Modul ist Teil davon mit denselben Rechten. Es kann die Sitzungsdatei lesen – den Schlüssel zu Ihrem Konto. Telegram weiß nichts von Modulen."
  q4: "Ein Modul hat unbemerkt Ihre Chats und die Sitzungsdatei an einen fremden Server gesendet. Was werden Sie höchstwahrscheinlich sehen?"
  q4_ans1: "Eine Warnung von Telegram über verdächtige Aktivität des Moduls"
  q4_ans2: "Fehler und verdächtige Einträge des Moduls in den Userbot-Logs"
  q4_ans3: "Eine Meldung des Userbot-Schutzes, dass das Senden der Daten blockiert wurde"
  q4_ans4: "Nichts, das Modul läuft im Hintergrund und muss keine Spuren hinterlassen"
  q4_hint: "Telegram sieht nicht, was ein Modul auf dem Server tut, und ins Log schreibt es nur, was es will. Der eingebaute Schutz erkennt nur einfache Versuche und ist umgehbar – prüfen Sie den Code."
  timeout: "<tg-emoji emoji-id=5447644880824181073>⚠️</tg-emoji> <b>Die Zeit für die Frage (60 Sekunden) ist abgelaufen. Um neu zu beginnen, senden Sie</b> <code>/start lm_verify</code> <b>in diesen Chat</b>"
  failed: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Falsche Antwort – die Erklärung finden Sie in der Umfrage oben (Symbol 💡). Die Prüfung beginnt wieder bei der ersten Frage, die Zahl der Versuche ist unbegrenzt: Senden Sie</b> <code>/start lm_verify</code> <b>in diesen Chat</b>"
  already_passed: "<tg-emoji emoji-id=5118861066981344121>✅</tg-emoji> <b>Sie haben die Prüfung bereits bestanden – die Installation von Modulen ist freigeschaltet</b>"
  unlocked: "<tg-emoji emoji-id=5118861066981344121>✅</tg-emoji> <b>Prüfung bestanden, die Installation von Modulen ist freigeschaltet. Falls eine Installation blockiert wurde, führen Sie den Befehl erneut aus.</b>"
  unlock_prompt: "<tg-emoji emoji-id=5447644880824181073>⚠️</tg-emoji> <b>Die Installation von Modulen ist gesperrt.</b> Um sie freizuschalten, beantworten Sie 4 Sicherheitsfragen: je 60 Sekunden, bei einem Fehler beginnt die Prüfung von vorn. Sie können sie beliebig oft wiederholen."
  unlock_prompt_btn: "Prüfung starten (4 Fragen)"
  name: "LoaderRestrictor"
  _cls_doc: "Sicherheitsprüfung vor der Installation von Modulen"

