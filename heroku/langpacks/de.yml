  _cmd_doc_setprefix: "<Präfix> [@Benutzer|ID|Antwort] - Ändert das Befehlspräfix. Ohne Ziel wird Ihr Hauptpräfix geändert; mit Ziel wird ein persönliches Präfix für einen Benutzer mit Zugriff auf den Userbot festgelegt (eine Antwort an eine Person ohne Zugriff ändert IHR Präfix)"
  _cmd_doc_setprefixes: "<Präfix> [Präfix ...] [--user @Benutzer|ID] - Ersetzt alle Befehlspräfixe (das erste ist das Hauptpräfix). Mit --user oder per Antwort werden persönliche Präfixe für einen anderen Benutzer festgelegt"
  _cmd_doc_togglecmd: "<Modul> <Befehl> oder <Befehl> - Einen Befehl aktivieren oder deaktivieren (erneuter Aufruf aktiviert ihn wieder)"
  _cmd_doc_togglemod: "<Modul> - Ein ganzes Modul aktivieren oder deaktivieren (erneuter Aufruf aktiviert es wieder). Das Modul Settings kann nicht deaktiviert werden"
  _cmd_doc_clearmodule: "<Modul> - Entfernt alle Daten und die Konfiguration des Moduls aus der Datenbank (hebt auch die Deaktivierung des Moduls und seiner Befehle auf)"
  _cmd_doc_unblacklist: "[Chat-ID] [Modul] - Hebt die Sperre des Userbots (oder Moduls) in einem Chat auf, standardmäßig im aktuellen. Die ID darf -100 enthalten"
  _cmd_doc_unblacklistuser: "[ID|Antwort] - Erlaubt einem Benutzer, zugelassene Befehle auszuführen. Ohne Argument: der Absender der beantworteten Nachricht bzw. der Gesprächspartner im Privatchat. @username wird nicht unterstützt"

