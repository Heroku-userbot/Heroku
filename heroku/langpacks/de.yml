settings:
  choose_installation: "<tg-emoji emoji-id=5363805650327450240>🪐</tg-emoji> <b>Wählen Sie Ihre Heroku-Installationsoption:</b>"
  vds_install: "<tg-emoji emoji-id=5471952986970267163>💎</tg-emoji> Die Installation auf einem VDS erfolgt mit einem einzigen Befehl:\n<pre><code class=\"language-shell\">sudo apt update &amp;&amp; sudo apt upgrade -y &amp;&amp; sudo apt install -y git python3-pip &amp;&amp; git clone https://github.com/Heroku-userbot/Heroku &amp;&amp; cd Heroku &amp;&amp; pip install -r requirements.txt &amp;&amp; python3 -m heroku</code></pre>\n<i>Hinweis: Wenn Sie keine sudo-Rechte haben, lassen Sie den entsprechenden Teil des Befehls weg.</i>"
  wsl_install: "<b>Installieren Sie WSL.</b> Öffnen Sie dazu PowerShell als Administrator und geben Sie <code>wsl --install -d Ubuntu-22.04</code> ein \n⚠️ <i>Für die Installation von WSL benötigen Sie Windows 10 Build 2004 oder Windows 11 (beliebige Version) sowie einen PC mit Virtualisierungsunterstützung. Für die Installation auf älteren Betriebssystemversionen siehe</i> <a href=\"https://learn.microsoft.com/en-us/windows/wsl/install-manual\">diese Seite</a>\n\n⬜️ <b>Starten Sie den PC neu und öffnen Sie die App Ubuntu 22.04.x</b> \n\n⬜️ <b>Fügen Sie dort den Befehl ein (Rechtsklick):</b> <code>curl -Ss https://bootstrap.pypa.io/get-pip.py | python3</code> \n⚠️ <i>Wenn gelbe Warnungen erscheinen, geben Sie</i> <code>export PATH=\"/home/username/.local/bin:$PATH\"</code> <i>ein und ersetzen Sie /home/username/.local/bin durch den in der Meldung genannten Pfad</i>\n\n⬜️ <b>Fügen Sie den Befehl ein (Rechtsklick):</b> \n<pre><code class=\"language-bash\">clear &amp;&amp; git clone https://github.com/Heroku-userbot/Heroku &amp;&amp; cd Heroku &amp;&amp; pip install -r requirements.txt &amp;&amp; python3 -m heroku</code></pre>\n🔗 <b>Wo erhalten Sie API_ID und API_HASH?</b>: <a href=\"https://youtu.be/DcqDA249Lhg?t=24\">Video</a>"
  userland_install: "<b>Installieren Sie UserLAnd über diesen</b> <a href=\"https://play.google.com/store/apps/details?id=tech.ula\">Link</a>\n\n<b>Öffnen Sie die App und wählen Sie Ubuntu —&gt; Minimal —&gt; Terminal</b>\n\n<b>Warten Sie, bis die Distribution installiert ist – Zeit für einen Tee</b>\n\n<b>Nach erfolgreicher Installation öffnet sich ein Terminal. Geben Sie dort ein:</b>\n<pre><code class=\"language-bash\">sudo apt update &amp;&amp; sudo apt upgrade -y &amp;&amp; sudo apt install python3 git python3-pip -y &amp;&amp; git clone https://github.com/Heroku-userbot/Heroku &amp;&amp; cd Heroku &amp;&amp; sudo pip install -r requirements.txt &amp;&amp; python3 -m heroku</code></pre>\n\n<b>Am Ende der Installation erscheint ein Link. Öffnen Sie ihn und geben Sie Ihre Kontodaten zur Anmeldung ein.\n\nVoilà! Sie haben Heroku auf UserLAnd installiert.</b>"
  hikkahost_install: "<b>🌘 Wie installiert man Heroku auf HikkaHost?</b>\n\n1. Gehe zu @hikkahost_bot\n2. Wähle \"Install\"\n3. Wähle \"🪐 Heroku\"\n\nUnd fahre mit der Installation fort.\n\n<b>Danach erhältst du einen Link, öffne ihn und logge dich in dein Konto ein.</b>"
  too_many_args: "<tg-emoji emoji-id=5121063440311386962>❌</tg-emoji> <b>Ungültige Argumente. Format:</b> <code>{prefix}{cmd} [Chat-ID] [Modul]</code>"
