name: Test install.sh

on:
  push:
    paths:
      - "install.sh"
      - "requirements.txt"
      - ".github/workflows/install-test.yml"
  pull_request:
    paths:
      - "install.sh"
      - "requirements.txt"
      - ".github/workflows/install-test.yml"
  workflow_dispatch: {}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: shellcheck -s bash install.sh

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - debian:bookworm
          - debian:trixie
          - fedora:latest
          - archlinux:latest
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && apt-get install -y git
          elif command -v dnf >/dev/null; then
            dnf install -y git
          elif command -v pacman >/dev/null; then
            pacman -Sy --noconfirm git
          fi

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Allow cloning the checkout
        run: git config --global --add safe.directory '*'

      - name: Install in minimal mode
        if: ${{ startsWith(matrix.image, 'ubuntu') || startsWith(matrix.image, 'debian') }}
        shell: bash
        run: |
          cd "$(mktemp -d)"
          HEROKU_MINIMAL=1 HEROKU_REPO_URL="$GITHUB_WORKSPACE" bash -s -- --help < "$GITHUB_WORKSPACE/install.sh"
          ! command -v ffmpeg

      - name: Install via pipe and run again
        shell: bash
        run: |
          cd "$(mktemp -d)"
          HEROKU_REPO_URL="$GITHUB_WORKSPACE" bash -s -- --help < "$GITHUB_WORKSPACE/install.sh"
          HEROKU_REPO_URL="$GITHUB_WORKSPACE" bash -s -- --help < "$GITHUB_WORKSPACE/install.sh" | tee rerun.log
          grep -q "already installed" rerun.log

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install via pipe
        run: |
          cd "$(mktemp -d)"
          HEROKU_REPO_URL="$GITHUB_WORKSPACE" /bin/bash -s -- --help < "$GITHUB_WORKSPACE/install.sh"
